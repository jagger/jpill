name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please **do not include real medicine names, doses or other health details**. Describe the problem with made-up examples.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: jPill version
      description: Settings, About shows it.
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 9, Android 15"
